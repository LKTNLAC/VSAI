backend:
  name: github
  repo: LKTNLAC/VSAI
  branch: main
  base_url: https://svvntaiando.io.vn
  auth_endpoint: oauth

media_folder: "frontend/assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: vi

site_url: https://svvntaiando.io.vn
display_url: https://svvntaiando.io.vn
logo_url: https://svvntaiando.io.vn/assets/images/logo.png

collections:
  # ==========================================
  # TIN TỨC (mảng trực tiếp, không bọc items)
  # ==========================================
  - name: "news"
    label: "📰 Tin tức"
    label_singular: "Tin tức"
    files:
      - name: "news_list"
        label: "Danh sách tin tức"
        file: "frontend/data/news.json"
        widget: "list"
        allow_add: true
        collapsed: true
        summary: "{{fields.title.vi}} ({{fields.date}})"
        fields:
          - { name: "id", label: "ID (số duy nhất)", widget: "number", value_type: "int", min: 1 }
          - name: "title"
            label: "Tiêu đề"
            widget: "object"
            fields:
              - { name: "vi", label: "🇻🇳 Tiếng Việt", widget: "string" }
              - { name: "en", label: "🇬🇧 English", widget: "string" }
          - { name: "date", label: "Ngày đăng", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - name: "category"
            label: "Danh mục"
            widget: "select"
            options:
              - { label: "Thông báo", value: "announcement" }
              - { label: "Sự kiện", value: "event" }
              - { label: "Chung", value: "general" }
              - { label: "Văn hóa", value: "culture" }
          - { name: "thumbnail", label: "Ảnh đại diện", widget: "image", required: false }
          - name: "summary"
            label: "Tóm tắt"
            widget: "object"
            fields:
              - { name: "vi", label: "🇻🇳 Tiếng Việt", widget: "text" }
              - { name: "en", label: "🇬🇧 English", widget: "text" }
          - { name: "featured", label: "Tin nổi bật", widget: "boolean", default: false, required: false }
          - name: "content"
            label: "Nội dung chi tiết"
            widget: "object"
            fields:
              - name: "vi"
                label: "🇻🇳 Tiếng Việt"
                widget: "list"
                summary: "{{fields.type}}"
                fields:
                  - { name: "type", label: "Loại", widget: "select", options: ["text", "image"] }
                  - { name: "value", label: "Nội dung text", widget: "text", required: false }
                  - { name: "src", label: "Đường dẫn ảnh", widget: "image", required: false }
                  - { name: "alt", label: "Mô tả ảnh (alt)", widget: "string", required: false }
                  - { name: "caption", label: "Chú thích ảnh", widget: "string", required: false }
              - name: "en"
                label: "🇬🇧 English"
                widget: "list"
                summary: "{{fields.type}}"
                fields:
                  - { name: "type", label: "Type", widget: "select", options: ["text", "image"] }
                  - { name: "value", label: "Text content", widget: "text", required: false }
                  - { name: "src", label: "Image path", widget: "image", required: false }
                  - { name: "alt", label: "Alt text", widget: "string", required: false }
                  - { name: "caption", label: "Caption", widget: "string", required: false }

  # ==========================================
  # HOẠT ĐỘNG (mảng trực tiếp)
  # ==========================================
  - name: "activities"
    label: "🎯 Hoạt động"
    label_singular: "Hoạt động"
    files:
      - name: "activities_list"
        label: "Danh sách hoạt động"
        file: "frontend/data/activities.json"
        widget: "list"
        allow_add: true
        collapsed: true
        summary: "{{fields.title.vi}} ({{fields.date}})"
        fields:
          - { name: "id", label: "ID (số duy nhất)", widget: "number", value_type: "int", min: 1 }
          - name: "title"
            label: "Tiêu đề"
            widget: "object"
            fields:
              - { name: "vi", label: "🇻🇳 Tiếng Việt", widget: "string" }
              - { name: "en", label: "🇬🇧 English", widget: "string" }
          - { name: "date", label: "Ngày diễn ra", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { name: "location", label: "Địa điểm", widget: "string" }
          - name: "category"
            label: "Danh mục"
            widget: "select"
            options:
              - { label: "Sự kiện", value: "event" }
              - { label: "Học thuật", value: "academic" }
              - { label: "Văn hóa", value: "culture" }
              - { label: "Thể thao", value: "sports" }
              - { label: "Cộng đồng", value: "community" }
              - { label: "Đối ngoại", value: "external" }
          - { name: "image", label: "Ảnh chính", widget: "image", required: false }
          - { name: "thumbnail", label: "Ảnh thumbnail (hover)", widget: "image", required: false }
          - name: "gallery"
            label: "Gallery ảnh phụ"
            widget: "list"
            required: false
            field: { name: "image", label: "Ảnh", widget: "image" }
          - name: "summary"
            label: "Tóm tắt"
            widget: "object"
            fields:
              - { name: "vi", label: "🇻🇳 Tiếng Việt", widget: "text" }
              - { name: "en", label: "🇬🇧 English", widget: "text" }
          - { name: "featured", label: "Nổi bật", widget: "boolean", default: false, required: false }
          - name: "content"
            label: "Nội dung chi tiết"
            widget: "object"
            fields:
              - name: "vi"
                label: "🇻🇳 Tiếng Việt"
                widget: "list"
                summary: "{{fields.type}}"
                fields:
                  - { name: "type", label: "Loại", widget: "select", options: ["text", "image"] }
                  - { name: "value", label: "Nội dung text", widget: "text", required: false }
                  - { name: "src", label: "Đường dẫn ảnh", widget: "image", required: false }
                  - { name: "alt", label: "Mô tả ảnh (alt)", widget: "string", required: false }
                  - { name: "caption", label: "Chú thích ảnh", widget: "string", required: false }
              - name: "en"
                label: "🇬🇧 English"
                widget: "list"
                summary: "{{fields.type}}"
                fields:
                  - { name: "type", label: "Type", widget: "select", options: ["text", "image"] }
                  - { name: "value", label: "Text content", widget: "text", required: false }
                  - { name: "src", label: "Image path", widget: "image", required: false }
                  - { name: "alt", label: "Alt text", widget: "string", required: false }
                  - { name: "caption", label: "Caption", widget: "string", required: false }
          - { name: "organizerId", label: "ID người tổ chức", widget: "number", value_type: "int", required: false }